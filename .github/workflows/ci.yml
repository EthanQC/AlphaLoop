name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      # The third gate the project requires before a commit, which CI had never
      # actually run (G3, 2026-07-28). It now also covers apps/openclaw-config,
      # whose ~74 .mjs scripts no compiler used to read.
      - run: pnpm typecheck
      - run: pnpm test
